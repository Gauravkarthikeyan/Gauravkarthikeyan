<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="radialCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radialViolet" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.1" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Drop Shadows / Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", "Roboto", "Helvetica Neue", sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 4px;
      fill: url(#neonGlow);
    }
    .sub-text {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-weight: 600;
      font-size: 14.5px;
      letter-spacing: 5px;
      fill: url(#subGrad);
    }
    .mono-meta {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .badge-label {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
    }
  </style>

  <!-- Base Canvas Card -->
  <rect x="2" y="2" width="1196" height="356" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <rect x="2" y="2" width="1196" height="356" rx="16" fill="url(#radialCyan)" />
  <rect x="2" y="2" width="1196" height="356" rx="16" fill="url(#radialViolet)" />

  <!-- Perspective Cyber Grid Layer -->
  <rect x="2" y="2" width="1196" height="356" rx="16" fill="url(#cyberGrid)" />

  <!-- Tech Accent Geometric Lines & Circuit Traces -->
  <g opacity="0.45">
    <line x1="80" y1="2" x2="80" y2="358" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.3" />
    <line x1="1120" y1="2" x2="1120" y2="358" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.3" />
    <!-- Diagonal HUD corners -->
    <path d="M 12 50 L 50 12" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />
    <path d="M 1150 12 L 1188 50" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.7" />
    <path d="M 12 310 L 50 348" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <path d="M 1150 348 L 1188 310" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Top Terminal Header Bar -->
  <g id="terminal-bar">
    <rect x="2" y="2" width="1196" height="42" rx="16" fill="#0c1220" fill-opacity="0.7" />
    <line x1="2" y1="44" x2="1198" y2="44" stroke="#1e293b" stroke-width="1.2" />

    <!-- Window Action Dots -->
    <circle cx="34" cy="23" r="6.5" fill="#ff5f56" />
    <circle cx="55" cy="23" r="6.5" fill="#ffbd2e" />
    <circle cx="76" cy="23" r="6.5" fill="#27c93f" />

    <!-- Terminal Breadcrumb / Shell Tab -->
    <rect x="110" y="10" width="310" height="26" rx="6" fill="#131c2e" stroke="#334155" stroke-width="0.8" />
    <text x="125" y="27" class="mono-meta" fill="#38bdf8">❯_ gaurav@mainframe: ~ (darwin-arm64)</text>

    <!-- Top Right Telemetry -->
    <g transform="translate(980, 16)">
      <circle cx="0" cy="7" r="4" fill="#00ff88" filter="url(#softGlow)" />
      <text x="12" y="11" class="mono-meta" fill="#00ff88" font-size="11">SECURE_LINK // 200 OK</text>
    </g>
  </g>

  <!-- Core Identity Block (Center) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Subtitle Pill / Status Tag -->
    <rect x="-185" y="-56" width="370" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1" opacity="0.85" />
    <circle cx="-160" cy="-42" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-145" y="-37" class="mono-meta" fill="#38bdf8" text-anchor="start" font-weight="700">DEV PROTOCOL • SYSTEM READY</text>
    <text x="160" y="-37" class="mono-meta" fill="#64748b" text-anchor="end">LOC: BLR_IN</text>

    <!-- Main Glowing Name -->
    <text x="0" y="22" class="title-text" filter="url(#glowEffect)">GAURAV KARTHIK</text>

    <!-- Sleek Tagline -->
    <text x="0" y="66" class="sub-text">WEB ARCHITECTURE  •  IOS SYSTEMS  •  CYBERSECURITY</text>
  </g>

  <!-- Bottom HUD Tech Badges Strip -->
  <g transform="translate(0, 280)">
    <!-- Dividing line -->
    <line x1="80" y1="0" x2="1120" y2="0" stroke="url(#borderGrad)" stroke-width="1" opacity="0.35" />

    <!-- Badges Container -->
    <g transform="translate(130, 20)">
      <!-- Badge 1: Web Architecture -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="34" rx="7" fill="#09101d" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#38bdf8" />
        <text x="20" y="21" class="badge-label" fill="#f8fafc">⚡ FULL-STACK ARCHITECT</text>
      </g>

      <!-- Badge 2: iOS Systems & Swift -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="215" height="34" rx="7" fill="#09101d" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#818cf8" />
        <text x="20" y="21" class="badge-label" fill="#f8fafc">📱 SWIFT &amp; IOS SYSTEMS</text>
      </g>

      <!-- Badge 3: Penetration Testing -->
      <g transform="translate(485, 0)">
        <rect x="0" y="0" width="220" height="34" rx="7" fill="#09101d" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#c084fc" />
        <text x="20" y="21" class="badge-label" fill="#f8fafc">🛡️ OWASP &amp; PEN-TESTING</text>
      </g>

      <!-- Badge 4: Hackathons -->
      <g transform="translate(735, 0)">
        <rect x="0" y="0" width="195" height="34" rx="7" fill="#09101d" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="4" height="34" rx="2" fill="#00ff88" />
        <text x="20" y="21" class="badge-label" fill="#00ff88">🏆 MULTI-HACK WINNER</text>
      </g>
    </g>
  </g>

  <!-- Outer Card Cyber Glass Border -->
  <rect x="2" y="2" width="1196" height="356" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
