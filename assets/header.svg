<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">Gaurav Karthikeyan</title>
  <desc id="d">A cubist head built from flat colored planes, annotated like an engineering drawing. Callouts label its parts with three projects: Tessera, Kairos and GkAgent.</desc>
  <style>
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .plane { transform-box: fill-box; transform-origin: center; animation: settle 760ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    .lead { stroke-dasharray: 260; animation: draw 620ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    .note { animation: fade 400ms ease-out both; }
    @keyframes settle { from { opacity: 0; transform: translateY(10px) scale(0.96); } }
    @keyframes draw { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .plane, .lead, .note { animation: none; } }
  </style>

  <rect width="1280" height="460" fill="#EFE6D2"/>
  <rect x="14" y="14" width="1252" height="432" fill="none" stroke="#1B1A17" stroke-width="1.5"/>

  <!-- left: name -->
  <text x="64" y="84" class="mono" font-size="15" fill="#5B564C">fig. 1  the engineer, exploded view</text>
  <text x="60" y="200" class="serif" font-size="108" fill="#1B1A17">Gaurav</text>
  <text x="60" y="306" class="serif" font-size="108" font-style="italic" fill="#1B1A17">Karthikeyan</text>
  <line x1="64" y1="346" x2="640" y2="346" stroke="#1B1A17" stroke-width="1.5"/>
  <text x="64" y="384" class="serif" font-size="26" fill="#1B1A17">I build systems, then I try to break them.</text>
  <text x="64" y="416" class="mono" font-size="15" fill="#5B564C">go / typescript / swift.  bengaluru, india.</text>

  <!-- right: cubist head -->
  <g>
    <polygon class="plane" style="animation-delay:0ms" points="790,96 950,62 1004,206 972,340 856,392 770,300" fill="#24479A"/>
    <g class="plane" style="animation-delay:60ms" stroke="#EFE6D2" stroke-width="1.2" opacity="0.45">
      <line x1="800" y1="140" x2="900" y2="104"/>
      <line x1="792" y1="170" x2="920" y2="124"/>
      <line x1="786" y1="200" x2="936" y2="146"/>
      <line x1="782" y1="230" x2="948" y2="170"/>
      <line x1="780" y1="260" x2="958" y2="196"/>
    </g>
    <polygon class="plane" style="animation-delay:120ms" points="904,74 1074,112 1110,262 1022,400 924,348 958,208" fill="#D69A2D"/>
    <polygon class="plane" style="animation-delay:180ms" points="846,330 980,302 1000,350 900,400" fill="#1B1A17"/>
    <polygon class="plane" style="animation-delay:240ms" points="962,168 1018,258 950,266" fill="#1B1A17"/>
    <path class="plane" style="animation-delay:300ms" d="M818 186 Q 862 152 904 186 Q 862 214 818 186 Z" fill="#EFE6D2" stroke="#1B1A17" stroke-width="3"/>
    <circle class="plane" style="animation-delay:330ms" cx="864" cy="185" r="9" fill="#1B1A17"/>
    <g class="plane" style="animation-delay:380ms">
      <circle cx="1042" cy="186" r="24" fill="#EFE6D2" stroke="#1B1A17" stroke-width="3"/>
      <circle cx="1042" cy="186" r="13" fill="#C1272D"/>
      <circle cx="1042" cy="186" r="4" fill="#EFE6D2"/>
    </g>
    <path class="plane" style="animation-delay:420ms" d="M908 332 L 958 322 L 990 330" fill="none" stroke="#EFE6D2" stroke-width="3" stroke-linecap="round"/>
    <polyline class="plane" style="animation-delay:440ms" points="956,62 1016,30 1080,70 1074,112" fill="none" stroke="#1B1A17" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- dimension line -->
  <g class="note" style="animation-delay:500ms" stroke="#1B1A17" stroke-width="1.2">
    <line x1="742" y1="62" x2="742" y2="400"/>
    <line x1="734" y1="62" x2="750" y2="62"/>
    <line x1="734" y1="400" x2="750" y2="400"/>
  </g>
  <text class="note mono" style="animation-delay:500ms" x="728" y="236" font-size="13" fill="#5B564C" text-anchor="middle" transform="rotate(-90 728 236)">1 head, scale 1:1</text>

  <!-- callouts -->
  <g fill="none" stroke="#1B1A17" stroke-width="1.3">
    <polyline class="lead" style="animation-delay:560ms" points="1066,186 1128,118 1146,118"/>
    <polyline class="lead" style="animation-delay:660ms" points="980,234 1128,234 1146,234"/>
    <polyline class="lead" style="animation-delay:760ms" points="994,338 1128,352 1146,352"/>
  </g>
  <g fill="#1B1A17">
    <circle class="note" style="animation-delay:560ms" cx="1066" cy="186" r="3.5"/>
    <circle class="note" style="animation-delay:660ms" cx="980" cy="234" r="3.5"/>
    <circle class="note" style="animation-delay:760ms" cx="994" cy="338" r="3.5"/>
  </g>
  <g class="mono" font-size="14">
    <text class="note" style="animation-delay:760ms" x="1154" y="114" fill="#1B1A17">a. tessera</text>
    <text class="note" style="animation-delay:760ms" x="1154" y="134" fill="#5B564C">sees every</text>
    <text class="note" style="animation-delay:760ms" x="1154" y="152" fill="#5B564C">interleaving</text>
    <text class="note" style="animation-delay:860ms" x="1154" y="230" fill="#1B1A17">b. kairos</text>
    <text class="note" style="animation-delay:860ms" x="1154" y="250" fill="#5B564C">smells late</text>
    <text class="note" style="animation-delay:860ms" x="1154" y="268" fill="#5B564C">work</text>
    <text class="note" style="animation-delay:960ms" x="1154" y="348" fill="#1B1A17">c. gkagent</text>
    <text class="note" style="animation-delay:960ms" x="1154" y="368" fill="#5B564C">reports only</text>
    <text class="note" style="animation-delay:960ms" x="1154" y="386" fill="#5B564C">what happened</text>
  </g>
</svg>
