<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Tessera: one simulated seed</title>
  <desc id="d">Three Raft replicas drawn as lanes over time. Messages cross between them, a network partition cuts off the leader, a duplicate message arrives late, a new leader is elected, and every client operation below is checked for linearizability.</desc>
  <style>
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .msg { stroke-dasharray: 120; animation: draw 420ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    .fade { animation: fade 420ms ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .msg, .fade { animation: none; } }
  </style>

  <rect width="1280" height="420" fill="#EFE6D2"/>
  <rect x="14" y="14" width="1252" height="392" fill="none" stroke="#1B1A17" stroke-width="1.5"/>

  <text x="64" y="58" class="mono" font-size="15" fill="#5B564C">fig. 2  one seed: a 3-replica raft group, a partition, a duplicate, every op checked</text>

  <!-- replica lanes as planes -->
  <polygon points="170,98 1000,92 1000,124 170,130" fill="#24479A" opacity="0.9"/>
  <polygon points="170,176 1000,172 1000,204 170,208" fill="#D69A2D"/>
  <polygon points="170,254 1000,256 1000,288 170,286" fill="#24479A" opacity="0.55"/>
  <g class="mono" font-size="14" fill="#1B1A17">
    <text x="64" y="118">n1</text>
    <text x="64" y="196">n2</text>
    <text x="64" y="274">n3</text>
  </g>
  <g class="mono" font-size="12" fill="#5B564C">
    <text x="92" y="118">leader</text>
    <text x="92" y="196">follower</text>
    <text x="92" y="274">follower</text>
  </g>

  <!-- partition: n1 cut off -->
  <polygon class="fade" style="animation-delay:600ms" points="520,80 640,80 640,144 520,144" fill="#EFE6D2"/>
  <polyline class="fade" style="animation-delay:600ms" points="520,80 532,96 516,112 532,128 520,144" fill="none" stroke="#C1272D" stroke-width="3" stroke-linejoin="round"/>
  <polyline class="fade" style="animation-delay:600ms" points="640,80 652,96 636,112 652,128 640,144" fill="none" stroke="#C1272D" stroke-width="3" stroke-linejoin="round"/>
  <text class="fade mono" style="animation-delay:600ms" x="580" y="117" font-size="13" fill="#A31F24" text-anchor="middle">partitioned</text>

  <!-- messages -->
  <g fill="none" stroke="#1B1A17" stroke-width="1.6" stroke-linecap="round">
    <line class="msg" style="animation-delay:0ms" x1="210" y1="126" x2="250" y2="178"/>
    <line class="msg" style="animation-delay:60ms" x1="210" y1="126" x2="270" y2="256"/>
    <line class="msg" style="animation-delay:180ms" x1="270" y1="178" x2="310" y2="126"/>
    <line class="msg" style="animation-delay:240ms" x1="290" y1="256" x2="330" y2="126"/>
    <line class="msg" style="animation-delay:360ms" x1="390" y1="126" x2="430" y2="178"/>
    <line class="msg" style="animation-delay:420ms" x1="390" y1="126" x2="450" y2="256"/>
    <line class="msg" style="animation-delay:900ms" x1="700" y1="204" x2="740" y2="256"/>
    <line class="msg" style="animation-delay:960ms" x1="760" y1="256" x2="800" y2="204"/>
    <line class="msg" style="animation-delay:1080ms" x1="840" y1="176" x2="880" y2="126"/>
  </g>
  <!-- duplicate, arrives late -->
  <line class="fade" style="animation-delay:1140ms" x1="450" y1="256" x2="860" y2="204" stroke="#94640F" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text class="fade mono" style="animation-delay:1140ms" x="868" y="234" font-size="12" fill="#5B564C">dup, late</text>

  <!-- new leader -->
  <circle class="fade" style="animation-delay:840ms" cx="680" cy="190" r="10" fill="#EFE6D2" stroke="#1B1A17" stroke-width="2.5"/>
  <circle class="fade" style="animation-delay:840ms" cx="680" cy="190" r="4" fill="#C1272D"/>
  <text class="fade mono" style="animation-delay:840ms" x="680" y="166" font-size="12" fill="#1B1A17" text-anchor="middle">n2 elected</text>

  <!-- client ops as intervals -->
  <g class="fade" style="animation-delay:1300ms" stroke-width="5" stroke-linecap="round">
    <line x1="190" y1="332" x2="300" y2="332" stroke="#1B1A17"/>
    <line x1="260" y1="350" x2="410" y2="350" stroke="#1B1A17"/>
    <line x1="420" y1="332" x2="560" y2="332" stroke="#1B1A17"/>
    <line x1="590" y1="350" x2="720" y2="350" stroke="#1B1A17"/>
    <line x1="740" y1="332" x2="900" y2="332" stroke="#24479A"/>
    <line x1="880" y1="350" x2="990" y2="350" stroke="#1B1A17"/>
  </g>
  <text class="fade mono" style="animation-delay:1300ms" x="64" y="346" font-size="12" fill="#5B564C">client ops</text>

  <!-- notes -->
  <g class="mono" font-size="13">
    <text x="1040" y="110" fill="#1B1A17">per seed:</text>
    <text x="1040" y="134" fill="#5B564C">10 s virtual time</text>
    <text x="1040" y="154" fill="#5B564C">~8 injected faults</text>
    <text x="1040" y="174" fill="#5B564C">~11k client ops</text>
    <text x="1040" y="194" fill="#5B564C">~200 ms wall clock</text>
    <text x="1040" y="250" fill="#1B1A17">then:</text>
    <text x="1040" y="274" fill="#5B564C">every op checked</text>
    <text x="1040" y="294" fill="#5B564C">for linearizability</text>
  </g>
  <text x="1040" y="350" class="serif" font-size="20" fill="#1B1A17">0/100 seeds failed</text>
</svg>
