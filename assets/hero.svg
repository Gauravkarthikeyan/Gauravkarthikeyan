<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1" stroke-opacity="0.22" />
    </pattern>

    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .term-text {
        font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Fira Code', 'Cascadia Code', monospace;
        font-size: 11px;
        letter-spacing: 0.2px;
        dominant-baseline: central;
      }
      .title-bold {
        font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Cascadia Code', monospace;
        font-weight: 800;
        letter-spacing: 1.5px;
      }
      .dim { fill: #475569; }
      .subtle { fill: #64748b; }
      .text { fill: #cbd5e1; }
      .bright { fill: #f8fafc; font-weight: 600; }
      .cyan { fill: #38bdf8; }
      .emerald { fill: #34d399; }
      .amber { fill: #fbbf24; }
      .purple { fill: #c084fc; }
      .rose { fill: #fb7185; }

      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .blink { animation: cursor-blink 1.05s infinite; }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .pulse { animation: pulse-dot 2.5s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Chassis & Background -->
  <rect x="1" y="1" width="918" height="378" rx="8" ry="8" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="2" y="2" width="916" height="376" rx="7" ry="7" fill="url(#grid-pattern)" />

  <!-- Terminal Window Chrome / Header Bar -->
  <path d="M 1 9 Q 1 1 9 1 L 911 1 Q 919 1 919 9 L 919 32 L 1 32 Z" fill="#0d1117" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="18" cy="16" r="4.5" fill="#ef4444" opacity="0.8" />
  <circle cx="34" cy="16" r="4.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="50" cy="16" r="4.5" fill="#10b981" opacity="0.8" />

  <!-- Terminal Header Title & Meta -->
  <text x="75" y="16" class="term-text dim">tty1</text>
